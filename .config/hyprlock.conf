background {
    monitor =
    path = screenshot   # takes a screenshot of your current screen and blurs it
    blur_passes = 5
    blur_size = 7
}

label {
    monitor =
    text = Hi there, $USER 
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Sans

    position = 0, 40         
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2-0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0-1.0
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 1.0)
    font_size = 95
    font_family = JetBrainsMono Nerd Font

    position = 0, 200
    halign = center
    valign = center
}
# ↩️ Logout Visual Indicator text
label {
    monitor =
    # Styled using Pango markup to make the hotkey bold and easily readable
    text = Press <b>Ctrl + Alt + Backspace</b> to Logout
    color = rgba(243, 139, 168, 1.0) # Sleek reddish tint
    font_size = 14
    font_family = Sans

    position = 0, 80                 # Positioned cleanly at the screen bottom
    halign = center
    valign = bottom
}
